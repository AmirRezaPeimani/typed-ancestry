[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiview-ancestry-audit"
version = "0.2.0"
description = "Typed exact-ancestry auditing for multi-view post-training datasets"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
analysis = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "pyarrow>=14",
  "matplotlib>=3.7",
]
neural = [
  "torch>=2.7,<2.8",
  "transformers==4.57.1",
  "peft==0.18.0",
  "accelerate==1.11.0",
  "huggingface_hub==0.36.2",
]
test = ["pytest>=8"]

[project.scripts]
ancestry-audit = "ancestry_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
