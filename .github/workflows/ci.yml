name: ancestry-audit

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install build -e ".[analysis,test]"
      - run: pytest
      - run: ancestry-audit --help
      - name: Verify submitted evidence
        run: >-
          python analysis/verify_controlled_release.py
          --output "$RUNNER_TEMP/verification_results.json"
      - name: Verify submitted artifact manifest
        run: |
          artifact_root="$RUNNER_TEMP/submitted-artifact"
          mkdir -p "$artifact_root"
          rsync -a --exclude=.git --exclude=.github ./ "$artifact_root/"
          python analysis/build_artifact_manifest.py \
            --root "$artifact_root" \
            --output "$RUNNER_TEMP/artifact_manifest.json"
          cmp "$RUNNER_TEMP/artifact_manifest.json" \
            manifests/artifact_manifest.json
      - name: Reproduce lightweight outputs in a disposable copy
        run: |
          repro_root="$RUNNER_TEMP/reproduction"
          mkdir -p "$repro_root"
          rsync -a --exclude=.git --exclude=.github ./ "$repro_root/"
          make -C "$repro_root" \
            PYTHON="$(command -v python)" \
            reproduce-light
          python "$repro_root/analysis/verify_controlled_release.py" \
            --root "$repro_root" \
            --output "$RUNNER_TEMP/reproduced_verification.json"
      - name: Build and smoke-test clean wheel
        run: |
          python -m build --outdir "$RUNNER_TEMP/dist"
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install \
            --no-deps "$RUNNER_TEMP"/dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/ancestry-audit" --help
